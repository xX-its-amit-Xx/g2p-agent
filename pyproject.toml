[project]
name = "g2p-agent"
version = "0.1.0"
description = "Retrieval-augmented Claude agent over Broad Institute Genomics 2 Proteins (G2P) portal data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "g2p-agent contributors" }]
keywords = ["genomics", "proteins", "variants", "rag", "claude", "llm-agent", "g2p"]

dependencies = [
    "anthropic>=0.40",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "g2papi>=1.0.4",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Real BGE embeddings. Heavy (pulls torch). Without this extra the agent falls
# back to the deterministic HashingEmbedder so the pipeline still runs offline.
embeddings = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
g2p-agent = "g2p_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g2p_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that require ANTHROPIC_API_KEY and/or network access to the G2P portal",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines OK; B008: Typer uses Option() in defaults by design;
# UP042: str+Enum is intentional for pydantic-friendly value enums.
ignore = ["E501", "B008", "UP042"]
